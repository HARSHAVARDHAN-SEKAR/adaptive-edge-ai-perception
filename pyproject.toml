[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-perception"
version = "0.2.0"
description = "Risk-aware adaptive multi-model perception engine for mobile robots"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8",
  "psutil>=5.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
real = ["ultralytics>=8.2,<9", "onnx>=1.15", "onnxruntime>=1.17"]
dev = ["reportlab>=4.0", "pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["edge_perception*"]
